[project]
name = "oak-dashcam"
version = "0.0.0"
description = "Multi-camera dashcam system for Raspberry Pi + Luxonis OAK cameras."
readme = "README.md"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["shared", "capture", "webapp/backend"]

[tool.uv.sources]
oak-dashcam-shared = { workspace = true }
oak-dashcam-capture = { workspace = true }
oak-dashcam-webapp = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pre-commit>=3.8.0",
    "types-PyYAML>=6.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# FastAPI idioms use `= Query(...)`, `= Depends(...)`, etc. in argument
# defaults — that's how the library's dependency injection works. B008
# flags those as "function call in default" which is wrong for FastAPI.
extend-safe-fixes = []

[tool.ruff.lint.per-file-ignores]
# DepthAI's Python API uses camelCase method names. Test doubles and the
# real wrapper must mirror those names exactly, so N802 is off in these files.
"capture/src/oak_dashcam_capture/depthai_camera.py" = ["N802"]
"capture/tests/test_depthai_camera.py" = ["N802"]
# FastAPI's route handlers use `Query(...)` as default values by design.
"webapp/backend/src/oak_dashcam_webapp/app.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["shared/src", "capture/src"]

# boto3 ships no type stubs; the model-store module keeps its S3
# client typed as Any (it's injectable for tests anyway).
[[tool.mypy.overrides]]
module = ["boto3"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["shared/tests", "capture/tests", "webapp/backend/tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

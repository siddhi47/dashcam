# Production stack: capture + webapp on the Raspberry Pi with real OAK
# hardware. Both services share a single named volume for segment files
# and the SQLite DB, so the webapp sees everything capture writes without
# any IPC beyond "the same file on disk".
#
# For Mac/Linux dev without OAK hardware, layer in the dev override:
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up
#
# which drops USB passthrough and forces mock cameras.

services:
  capture:
    build:
      context: ..
      dockerfile: capture/Dockerfile
    image: oak-dashcam-capture:local
    restart: unless-stopped
    # `privileged: true` gives the container full device-cgroup access so
    # it can talk to any USB device hot-plugged into the host. On macOS
    # Docker Desktop this is a no-op and the dev-override drops it.
    privileged: true
    # AWS credentials for the detection-model S3 sync (detection.s3 in
    # dashcam.yaml). Passed through from the host environment / a .env
    # file next to this compose file — never hardcoded here. Empty
    # values are harmless: model sync just falls back to the locally
    # cached model with a warning.
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - ../deploy/dashcam.docker.yaml:/config/dashcam.yaml:ro
      # Recordings + SQLite DB live on the microSD root filesystem at
      # /var/lib/oak-dashcam. Originally this was a bind mount to an
      # external SSD, but the SSD proved unreliable — random write
      # timeouts that remounted ext4 read-only and crashed both
      # services. Until a replacement SSD is in, everything lives on
      # the SD; retention_gb in dashcam.yaml keeps usage bounded.
      - /var/lib/oak-dashcam:/data/dashcam
      # IMPORTANT: /dev/bus/usb is mounted as a **bind volume**, not via
      # `devices:`. Docker's `--device` flag snapshots host device files
      # at container-start and never updates — when an OAK camera resets
      # itself during DepthAI's boot sequence (normal behavior), the
      # host gets a new /dev/bus/usb/XXX node but the container's static
      # snapshot still references the old one, and DepthAI fails with
      # `X_LINK_DEVICE_NOT_FOUND`. A live bind mount reflects hot-plug
      # events as they happen. Luxonis's own docker examples use this
      # form for the same reason.
      - /dev/bus/usb:/dev/bus/usb

  webapp:
    build:
      context: ..
      dockerfile: webapp/Dockerfile
    image: oak-dashcam-webapp:local
    restart: unless-stopped
    depends_on:
      - capture
    ports:
      - "8080:8080"
    volumes:
      - ../deploy/dashcam.docker.yaml:/config/dashcam.yaml:ro
      - /var/lib/oak-dashcam:/data/dashcam
      # Docker socket: lets the webapp trigger host-level operations
      # like `shutdown -h now` via the Docker SDK. The webapp spawns
      # a one-shot privileged container that calls nsenter into PID 1.
      # This is equivalent to root on the host — acceptable for a
      # single-user LAN-only dashcam, not for a public-facing service.
      - /var/run/docker.sock:/var/run/docker.sock

# Config used by the docker-compose stack in deploy/.
#
# Differs from ../config/dashcam.yaml only in `storage.root`, which is an
# absolute container path pointing at the shared volume mount. The cameras
# list here is the *first-run seed*: once the capture service has populated
# the `cameras` table in `/data/dashcam/dashcam.db`, edits from the webapp
# become authoritative and this section is ignored on subsequent starts.

storage:
  root: /data/dashcam
  # SSD is offline — all data lives on the Pi's microSD root fs (~18 GB free).
  # Aggressive cap keeps the SD from filling up.
  retention_gb: 10
  segment_seconds: 60

cameras:
  - id: front
    mxid: auto
    role: front
    resolution: 1080p
    fps: 30
    codec: h265
    bitrate_kbps: 8000

detection:
  # On-device YOLO detection. No s3 source configured yet — capture
  # will use whatever NNArchive is cached in /data/dashcam/models, or
  # log a warning and run without detection if there is none. To pull
  # models from S3, fill in the s3 block and provide AWS credentials
  # via the environment (see docker-compose.yml).
  enabled: true
  confidence_threshold: 0.5
  # s3:
  #   bucket: my-models-bucket
  #   prefix: dashcam/
  #   region: us-east-1

webapp:
  bind: 0.0.0.0:8080
  auth:
    mode: none
  live_preview: true

logging:
  level: info

[project]
name = "oak-dashcam-shared"
version = "0.0.0"
description = "Shared schemas and config models for oak-dashcam."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.0",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oak_dashcam_shared"]

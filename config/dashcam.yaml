storage:
  root: data/dashcam
  retention_gb: 200
  segment_seconds: 60

cameras:
  - id: front
    mxid: "18443010C145DB0E00"
    role: front
    resolution: 1080p
    fps: 30
    codec: h265
    bitrate_kbps: 8000
  - id: rear
    mxid: "18443010D1BFDA0E00"
    role: rear
    resolution: 1080p
    fps: 30
    codec: h265
    bitrate_kbps: 8000

detection:
  # On-device YOLO object detection (runs on the OAK's VPU, drawn as
  # bbox overlays in the web UI). With no model cached locally and no
  # s3 source, capture logs a warning and records without detection.
  enabled: true
  confidence_threshold: 0.5
  # model_dir: /data/dashcam/models   # default: {storage.root}/models
  # s3:
  #   bucket: my-models-bucket
  #   prefix: dashcam/
  #   region: us-east-1
  #   # endpoint_url: http://minio.local:9000   # for S3-compatible stores

webapp:
  bind: 0.0.0.0:8080
  auth:
    mode: none
  live_preview: true

logging:
  level: info

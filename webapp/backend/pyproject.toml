[project]
name = "oak-dashcam-webapp"
version = "0.0.0"
description = "Web UI backend: browse, stream, and download dashcam recordings."
requires-python = ">=3.11"
dependencies = [
    "oak-dashcam-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "docker>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oak_dashcam_webapp"]

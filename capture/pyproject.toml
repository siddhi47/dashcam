[project]
name = "oak-dashcam-capture"
version = "0.0.0"
description = "Capture service: records from OAK cameras to segmented MP4 files."
requires-python = ">=3.11"
dependencies = [
    "oak-dashcam-shared",
    "depthai>=2.28.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "boto3>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oak_dashcam_capture"]
